apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-web
  namespace: aistockcn-research
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: research-web
  template:
    metadata:
      labels:
        app: research-web
    spec:
      containers:
        - name: web
          image: aistockcn-research-web:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: research-config
            - secretRef:
                name: research-secrets
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: research-web
  namespace: aistockcn-research
spec:
  selector:
    app: research-web
  ports:
    - name: http
      port: 3000
      targetPort: http
