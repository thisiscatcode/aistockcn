apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-web
  namespace: aistockcn-research
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 55m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [research.aistockcn.com]
      secretName: research-aistockcn-tls
  rules:
    - host: research.aistockcn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: research-web
                port:
                  number: 3000
