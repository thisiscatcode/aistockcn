apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-worker
  namespace: aistockcn-research
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: research-worker
  template:
    metadata:
      labels:
        app: research-worker
    spec:
      containers:
        - name: worker
          image: aistockcn-research-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.research_worker"]
          envFrom:
            - configMapRef:
                name: research-config
            - secretRef:
                name: research-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
