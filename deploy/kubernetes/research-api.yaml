apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-api
  namespace: aistockcn-research
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: research-api
  template:
    metadata:
      labels:
        app: research-api
    spec:
      containers:
        - name: api
          image: aistockcn-research-api:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.research_main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: research-config
            - secretRef:
                name: research-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: research-api
  namespace: aistockcn-research
spec:
  selector:
    app: research-api
  ports:
    - name: http
      port: 8000
      targetPort: http
