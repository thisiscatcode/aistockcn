apiVersion: v1
kind: ConfigMap
metadata:
  name: research-config
  namespace: aistockcn-research
data:
  AWS_REGION: eu-west-2
  RESEARCH_LLM_BASE_URL: http://ollama:11434
  RESEARCH_LLM_MODEL: qwen2.5:3b
  RESEARCH_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
  RESEARCH_RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
  RESEARCH_MODEL_CACHE_DIR: /models/sentence-transformers
