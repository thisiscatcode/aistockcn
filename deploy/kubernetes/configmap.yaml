  PANEL_API_ALLOWED_CIDRS: 10.0.0.0/8
  PANEL_API_ALLOWED_SERVICE_NAMES: research-web
  API_BASE_URL: http://research-api:8000
  PANEL_PUBLIC_URL: https://research.aistockcn.com
  PANEL_PUBLIC_HOSTS: research.aistockcn.com
