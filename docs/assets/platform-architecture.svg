<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">AiStockCN production platform architecture</title>
  <desc id="desc">The authenticated Next.js product connects to separate platform, research and US market FastAPI services, PostgreSQL and pgvector, background workers, model services and controlled execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071427"/><stop offset="1" stop-color="#101b3c"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="glow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#65a7ef"/></marker>
    <style>.t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}.title{font-size:40px;font-weight:800}.sub{font-size:18px;font-weight:560;fill:#9fb8d8}.h{font-size:18px;font-weight:760}.p{font-size:13px;font-weight:520;fill:#a9bdd5}.tiny{font-size:11px;font-weight:750;fill:#78a9dc;letter-spacing:1px}.card{fill:#111f38;stroke:#29415f;stroke-width:1.3;rx:15;filter:url(#glow)}.line{fill:none;stroke:#65a7ef;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#8b7bf0;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="260" fill="#2563eb" opacity=".07"/><circle cx="120" cy="690" r="260" fill="#8b5cf6" opacity=".06"/>
  <text x="80" y="62" class="t title">Production platform architecture</text><text x="80" y="92" class="t sub">Independent services, durable data contracts and market-isolated execution paths</text>

  <rect x="70" y="150" width="240" height="100" class="card"/><rect x="90" y="171" width="52" height="52" rx="12" fill="url(#cyan)"/><path d="M102 210v-23h28v23M108 195h16" fill="none" stroke="#fff" stroke-width="2.5"/><text x="160" y="186" class="t tiny">CUSTOMER LAYER</text><text x="160" y="211" class="t h">Next.js product</text><text x="160" y="232" class="t p">RBAC · market shell · SSE</text>

  <rect x="390" y="135" width="300" height="130" class="card"/><text x="420" y="168" class="t tiny">CORE PLATFORM</text><text x="420" y="195" class="t h">Platform FastAPI</text><text x="420" y="219" class="t p">A-share data, portfolios and models</text><text x="420" y="241" class="t p">Validation gates · controlled execution</text><rect x="635" y="157" width="28" height="84" rx="8" fill="url(#green)" opacity=".85"/>
  <rect x="730" y="135" width="300" height="130" class="card"/><text x="760" y="168" class="t tiny">AI RESEARCH</text><text x="760" y="195" class="t h">Research FastAPI</text><text x="760" y="219" class="t p">LangGraph · tools · citations · SSE</text><text x="760" y="241" class="t p">US + CN market-scoped evidence</text><rect x="975" y="157" width="28" height="84" rx="8" fill="url(#purple)" opacity=".9"/>
  <rect x="1070" y="135" width="300" height="130" class="card"/><text x="1100" y="168" class="t tiny">US MARKET</text><text x="1100" y="195" class="t h">US Market FastAPI</text><text x="1100" y="219" class="t p">Prices · fundamentals · market session</text><text x="1100" y="241" class="t p">Selections · model readiness gates</text><rect x="1315" y="157" width="28" height="84" rx="8" fill="url(#cyan)" opacity=".9"/>
  <path d="M310 200 H382" class="line"/><path d="M310 200 C345 200 345 290 710 290 V210 H722" class="line"/><path d="M310 200 C345 200 345 310 1050 310 V210 H1062" class="line"/>

  <rect x="80" y="385" width="270" height="120" class="card"/><text x="110" y="418" class="t tiny">DATA SOURCES</text><text x="110" y="448" class="t h">Official + market providers</text><text x="110" y="474" class="t p">SEC EDGAR · XBRL · exchanges</text><text x="110" y="495" class="t p">Finnhub · Massive · broker data</text>
  <rect x="405" y="365" width="290" height="160" class="card"/><text x="435" y="398" class="t tiny">BACKGROUND COMPUTE</text><text x="435" y="427" class="t h">Ingestion workers</text><text x="435" y="451" class="t p">PDF/HTML extraction and chunking</text><text x="435" y="473" class="t p">Embeddings · retries · checksums</text><text x="435" y="495" class="t p">SKIP LOCKED PostgreSQL queue</text>
  <rect x="750" y="365" width="300" height="160" class="card"/><text x="780" y="398" class="t tiny">DURABLE STATE</text><text x="780" y="427" class="t h">PostgreSQL + pgvector</text><text x="780" y="451" class="t p">Facts · metadata · chunks · vectors</text><text x="780" y="473" class="t p">Runs · reviews · traces · model registry</text><text x="780" y="495" class="t p">Source lineage and audit locators</text>
  <rect x="1105" y="365" width="290" height="160" class="card"/><text x="1135" y="398" class="t tiny">MODEL SERVICES</text><text x="1135" y="427" class="t h">LLM + PyTorch + ML</text><text x="1135" y="451" class="t p">Structured Groq inference</text><text x="1135" y="473" class="t p">Cross-encoder reranking</text><text x="1135" y="495" class="t p">LightGBM market pipelines</text>
  <path d="M350 445 H397" class="line"/><path d="M695 445 H742" class="line"/><path d="M1050 445 H1097" class="line"/>
  <path d="M540 265 V350" class="dash"/><path d="M880 265 V350" class="dash"/><path d="M1220 265 V350" class="dash"/>

  <rect x="120" y="625" width="300" height="75" class="card"/><text x="150" y="654" class="t tiny">OBSERVABILITY</text><text x="150" y="680" class="t h">Logs · metrics · run history</text>
  <rect x="485" y="625" width="300" height="75" class="card"/><text x="515" y="654" class="t tiny">QUALITY GATES</text><text x="515" y="680" class="t h">Evaluation · validation · activation</text>
  <rect x="850" y="625" width="300" height="75" class="card"/><text x="880" y="654" class="t tiny">PORTFOLIO</text><text x="880" y="680" class="t h">Positions · targets · paper state</text>
  <rect x="1215" y="625" width="265" height="75" class="card"/><text x="1245" y="654" class="t tiny">EXECUTION</text><text x="1245" y="680" class="t h">Market-specific controls</text>
  <path d="M900 525 V580 H270 V617" class="line"/><path d="M900 525 V580 H635 V617" class="line"/><path d="M900 525 V580 H1000 V617" class="line"/><path d="M1000 700 H1207" class="line"/>
</svg>
