<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AiStockCN evidence-grounded research architecture</title>
  <desc id="desc">A LangGraph research workflow connects the authenticated product to validated financial facts, market data, hybrid filing retrieval, deterministic calculations, evidence synthesis and citation validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315ea8"/></marker>
    <style>
      .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#14213d}.title{font-size:43px;font-weight:800;letter-spacing:-1px}.sub{font-size:21px;font-weight:650;fill:#3563c7}.h{font-size:19px;font-weight:780}.p{font-size:14px;font-weight:520;fill:#52647f}.tiny{font-size:12px;font-weight:700;fill:#66758d;letter-spacing:.4px}.card{fill:#fff;stroke:#c9d7ef;stroke-width:1.5;rx:16;filter:url(#shadow)}.soft-blue{fill:#eff6ff;stroke:#8bb4ff}.soft-violet{fill:#f5f1ff;stroke:#b8a0f7}.soft-green{fill:#effcf8;stroke:#84d9c2}.line{fill:none;stroke:#315ea8;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#7c5ce0;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="64" text-anchor="middle" class="t title">AiStockCN Research Architecture</text>
  <text x="800" y="99" text-anchor="middle" class="t sub">Evidence-grounded equity intelligence for US and China markets</text>
  <path d="M320 91 H525 M1075 91 H1280" stroke="#8eabdf" stroke-width="2"/>

  <rect x="65" y="145" width="180" height="118" class="card soft-blue"/>
  <circle cx="155" cy="178" r="18" fill="#2563eb" opacity=".15"/><path d="M145 180h20M155 170v20" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text x="155" y="220" text-anchor="middle" class="t h">Authenticated user</text><text x="155" y="243" text-anchor="middle" class="t p">Company-scoped question</text>

  <rect x="310" y="145" width="230" height="118" class="card soft-blue"/>
  <rect x="335" y="166" width="42" height="34" rx="7" fill="url(#blue)"/><path d="M345 188l8-9 7 7 8-12" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="400" y="185" class="t h">Next.js product</text><text x="335" y="220" class="t p">Research workspace · SSE progress</text><text x="335" y="242" class="t p">Evidence, inference and limitations</text>

  <rect x="605" y="145" width="230" height="118" class="card soft-green"/>
  <path d="M635 174l22-12 22 12v25l-22 12-22-12z" fill="none" stroke="#059669" stroke-width="3"/><text x="657" y="190" text-anchor="middle" class="t tiny" fill="#059669">API</text>
  <text x="700" y="182" class="t h">FastAPI services</text><text x="630" y="220" class="t p">Authentication · validation · streaming</text><text x="630" y="242" class="t p">Rate limits · durable run history</text>

  <rect x="905" y="125" width="620" height="176" class="card soft-violet"/>
  <circle cx="945" cy="161" r="20" fill="url(#violet)"/><path d="M934 162l8 8 15-18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="980" y="167" class="t h">LangGraph Orchestrator</text><text x="980" y="190" class="t p">Typed, stateful and traceable multi-step workflow</text>
  <rect x="935" y="213" width="170" height="58" rx="11" fill="#fff" stroke="#c4b5fd"/><text x="1020" y="237" text-anchor="middle" class="t h">Plan</text><text x="1020" y="257" text-anchor="middle" class="t tiny">SCHEMA-CONSTRAINED</text>
  <rect x="1130" y="213" width="170" height="58" rx="11" fill="#fff" stroke="#c4b5fd"/><text x="1215" y="237" text-anchor="middle" class="t h">Execute</text><text x="1215" y="257" text-anchor="middle" class="t tiny">ALLOW-LISTED TOOLS</text>
  <rect x="1325" y="213" width="170" height="58" rx="11" fill="#fff" stroke="#c4b5fd"/><text x="1410" y="237" text-anchor="middle" class="t h">Validate</text><text x="1410" y="257" text-anchor="middle" class="t tiny">CITATIONS + OUTPUT</text>

  <path d="M245 204 H302" class="line"/><path d="M540 204 H597" class="line"/><path d="M835 204 H897" class="line"/>

  <rect x="95" y="365" width="330" height="105" class="card"/><circle cx="137" cy="406" r="23" fill="#e7f0ff"/><path d="M124 397h26v20h-26zM128 392h18" fill="none" stroke="#2563eb" stroke-width="3"/><text x="175" y="402" class="t h">SEC financial facts</text><text x="175" y="426" class="t p">Validated XBRL periods, units and taxonomy</text><text x="175" y="448" class="t p">Current · previous · deterministic delta</text>
  <rect x="465" y="365" width="300" height="105" class="card"/><circle cx="507" cy="406" r="23" fill="#e9fbf4"/><path d="M493 417v-16M505 417v-26M517 417v-34" stroke="#059669" stroke-width="5"/><text x="545" y="402" class="t h">Market data</text><text x="545" y="426" class="t p">Prices, volume and valuation</text><text x="545" y="448" class="t p">As-of dates and source provenance</text>
  <rect x="805" y="340" width="650" height="155" class="card"/><circle cx="850" cy="385" r="23" fill="#f2edff"/><circle cx="845" cy="380" r="10" fill="none" stroke="#7c3aed" stroke-width="3"/><path d="M853 388l10 10" stroke="#7c3aed" stroke-width="3"/><text x="890" y="380" class="t h">Filing search</text><text x="890" y="404" class="t p">SEC EDGAR · SSE · SZSE/CNINFO · BSE · uploaded PDFs</text>
  <rect x="835" y="430" width="275" height="42" rx="9" fill="#f8f7ff" stroke="#cabdf5"/><text x="972" y="456" text-anchor="middle" class="t h">FTS + pgvector + RRF</text>
  <rect x="1135" y="430" width="290" height="42" rx="9" fill="#f8f7ff" stroke="#cabdf5"/><text x="1280" y="456" text-anchor="middle" class="t h">PyTorch cross-encoder</text>

  <path d="M1020 301 V330 H260 V356" class="dash"/><path d="M1215 301 V330 H615 V356" class="dash"/><path d="M1410 301 V330 H1130 V332" class="dash"/>

  <rect x="300" y="555" width="1000" height="92" class="card soft-blue"/>
  <circle cx="350" cy="601" r="25" fill="url(#blue)"/><path d="M337 601l9 9 18-21" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="390" y="590" class="t h">Verified evidence set</text><text x="390" y="616" class="t p">Financial facts + relevant passages + deterministic calculations + immutable source locators</text>
  <rect x="1060" y="577" width="205" height="46" rx="10" fill="#fff" stroke="#9bb9ea"/><text x="1162" y="597" text-anchor="middle" class="t tiny">SERVER-ASSIGNED IDS</text><text x="1162" y="615" text-anchor="middle" class="t p">Never invented by the LLM</text>
  <path d="M260 470 V525 H540 V547" class="line"/><path d="M615 470 V547" class="line"/><path d="M1130 495 V525 H1010 V547" class="line"/>

  <rect x="365" y="700" width="270" height="76" class="card soft-violet"/><text x="500" y="729" text-anchor="middle" class="t h">LLM synthesis</text><text x="500" y="751" text-anchor="middle" class="t p">Reasoning over supplied evidence</text>
  <rect x="665" y="700" width="270" height="76" class="card soft-violet"/><text x="800" y="729" text-anchor="middle" class="t h">Citation validation</text><text x="800" y="751" text-anchor="middle" class="t p">Grounding and evidence-ID checks</text>
  <rect x="965" y="690" width="330" height="96" class="card soft-green"/><text x="1130" y="720" text-anchor="middle" class="t h">Structured response</text><text x="1130" y="745" text-anchor="middle" class="t p">Answer · evidence · financial trends</text><text x="1130" y="766" text-anchor="middle" class="t p">Model inference · limitations · trace</text>
  <path d="M800 647 V675 H500 V692" class="line"/><path d="M635 738 H657" class="line"/><path d="M935 738 H957" class="line"/>

  <rect x="175" y="825" width="1250" height="48" rx="14" fill="#fff" stroke="#d4deee"/>
  <text x="390" y="855" text-anchor="middle" class="t p">Deterministic computation whenever possible</text><path d="M590 836v25" stroke="#d4deee"/>
  <text x="800" y="855" text-anchor="middle" class="t p">Retrieval + reranking for qualitative evidence</text><path d="M1010 836v25" stroke="#d4deee"/>
  <text x="1210" y="855" text-anchor="middle" class="t p">LLM as synthesis layer, not source of truth</text>
</svg>
