name: aistockcn

services:
  data-prep:
    build:
      context: .
      dockerfile: Dockerfile
    image: aistockcn-data-prep:latest
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - ./run/panel.env
    environment:
      TZ: UTC
    networks:
      - default
      - paper-db
    command: []

  panel-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: aistockcn-panel-api:latest
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./run/panel.env
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PROJECT_ROOT: /workspace
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-/opt/aistockcn}
      PANEL_API_ALLOWED_CIDRS: ${PANEL_API_ALLOWED_CIDRS:-127.0.0.1/32,::1/128}
      PANEL_API_ALLOWED_SERVICE_NAMES: ${PANEL_API_ALLOWED_SERVICE_NAMES:-panel-web,panel-web-fei}
    networks:
      - default
      - paper-db
    ports:
      - "127.0.0.1:8001:8000"

  us-market-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: aistockcn-us-market-api:20260812-v1
    restart: unless-stopped
    working_dir: /app
    command: uvicorn app.us_market_main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./run/panel.env
    environment:
      PROJECT_ROOT: /workspace
      PANEL_API_ALLOWED_CIDRS: ${US_MARKET_API_ALLOWED_CIDRS:-127.0.0.1/32,::1/128}
      PANEL_API_ALLOWED_SERVICE_NAMES: panel-web
    networks:
      - default
      - paper-db
    ports:
      - "127.0.0.1:8004:8000"

  research-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: aistockcn-research-api:20260813-streaming-v1
    restart: unless-stopped
    working_dir: /app
    command: uvicorn app.research_main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./run/panel.env
    environment:
      PROJECT_ROOT: /workspace
      PANEL_API_ALLOWED_CIDRS: ${RESEARCH_API_ALLOWED_CIDRS:-127.0.0.1/32,::1/128}
      PANEL_API_ALLOWED_SERVICE_NAMES: panel-web
      RESEARCH_UPLOAD_DIR: /data/research_uploads
      RESEARCH_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      RESEARCH_RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      RESEARCH_MODEL_CACHE_DIR: /models/sentence-transformers
      RESEARCH_INLINE_INDEXING: "false"
      RESEARCH_SEC_REQUEST_INTERVAL_SECONDS: "0.25"
      RESEARCH_S3_BUCKET: ${RESEARCH_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
    volumes:
      - research-uploads:/data/research_uploads
      - sentence-transformers-models:/models/sentence-transformers
    networks:
      - default
      - paper-db
      - ai-services
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  research-worker:
    image: aistockcn-research-api:20260813-streaming-v1
    restart: unless-stopped
    scale: 2
    cpus: "1.25"
    working_dir: /app
    command: python -m app.research_worker
    depends_on:
      research-api:
        condition: service_healthy
    env_file:
      - ./run/panel.env
    environment:
      PROJECT_ROOT: /workspace
      RESEARCH_UPLOAD_DIR: /data/research_uploads
      RESEARCH_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      RESEARCH_RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      RESEARCH_MODEL_CACHE_DIR: /models/sentence-transformers
      RESEARCH_S3_BUCKET: ${RESEARCH_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
    volumes:
      - research-uploads:/data/research_uploads
      - sentence-transformers-models:/models/sentence-transformers
    networks:
      - default
      - paper-db

  research-coverage-worker:
    image: aistockcn-research-api:20260813-streaming-v1
    restart: unless-stopped
    cpus: "0.50"
    working_dir: /app
    command: python -m app.research_coverage_worker
    depends_on:
      research-api:
        condition: service_healthy
    env_file:
      - ./run/panel.env
    environment:
      PROJECT_ROOT: /workspace
      RESEARCH_UPLOAD_DIR: /data/research_uploads
      RESEARCH_SEC_REQUEST_INTERVAL_SECONDS: "0.25"
      RESEARCH_S3_BUCKET: ${RESEARCH_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-eu-west-2}
    volumes:
      - research-uploads:/data/research_uploads
    networks:
      - default
      - paper-db

  panel-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: aistockcn-panel-web:20260813-us-workstation-v5
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - panel-api
      - research-api
      - us-market-api
    env_file:
      - ./run/panel.env
    environment:
      API_BASE_URL: http://panel-api:8000
      RESEARCH_API_BASE_URL: http://research-api:8000
      US_MARKET_API_BASE_URL: http://us-market-api:8000
      PANEL_PUBLIC_URL: https://aistockcn.com
      PANEL_PUBLIC_HOSTS: aistockcn.com,www.aistockcn.com,quantcn.wintrusttech.com
    volumes:
      - ./run:/run-config:ro
    ports:
      - "127.0.0.1:3030:3000"

  panel-web-fei:
    build:
      context: .
      dockerfile: apps/web-fei/Dockerfile
    image: aistockcn-panel-web-fei:latest
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - panel-api
    env_file:
      - ./run/panel.env
    environment:
      API_BASE_URL: http://panel-api:8000
      PANEL_PUBLIC_URL: https://fei.wintrusttech.com
      PANEL_PUBLIC_HOSTS: fei.wintrusttech.com
    volumes:
      - ./run:/run-config:ro
      - ./apps/web-fei/private:/app/private:ro
    ports:
      - "127.0.0.1:3031:3000"

networks:
  paper-db:
    external: true
    name: ${PAPER_DB_NETWORK:-elearn_default}
  ai-services:
    external: true
    name: ai_services

volumes:
  research-uploads:
  sentence-transformers-models:
    external: true
    name: enterprise-agent-platform_sentence-transformers-models
